name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # next lint and next build both load next.config.ts (which validates env),
    # so provide placeholder infra vars and skip strict validation job-wide.
    # Real secrets are validated at their point of use, not in CI.
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Run `next build` directly (not `npm run build`) so CI does not need a
      # live database for `prisma migrate deploy`.
      - name: Build
        run: npx next build
